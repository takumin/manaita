---
# https://taskfile.dev
# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  PKGNAME:
    sh: go mod edit -json | jq -r '.Module.Path'

  RAW_VERSION:
    sh: git describe --tags --abbrev=0 2>/dev/null || echo 'v0.0.0'
  COMMIT_ID:
    sh: git rev-parse HEAD 2>/dev/null || exit 0

  VERSION: '{{trimPrefix "v" .RAW_VERSION}}'
  REVISION: '{{.COMMIT_ID}}'
  # Builds from an exact release tag carry no prerelease suffix.
  PRERELEASE:
    sh: git describe --tags --exact-match >/dev/null 2>&1 || echo 'dev'
  FULLVERSION: '{{.VERSION}}{{if ne "" .PRERELEASE}}-{{.PRERELEASE}}{{end}}'

  LDFLAGS_VERSION: -X "{{.PKGNAME}}/internal/version.version={{.VERSION}}"
  LDFLAGS_REVISION: -X "{{.PKGNAME}}/internal/version.revision={{.REVISION}}"
  LDFLAGS_PRERELEASE: -X "{{.PKGNAME}}/internal/version.prerelease={{.PRERELEASE}}"
  LDFLAGS_VARIABLES: '{{.LDFLAGS_VERSION}} {{.LDFLAGS_REVISION}} {{.LDFLAGS_PRERELEASE}}'
  BUILDFLAGS: -trimpath -ldflags '-s -w -buildid= {{.LDFLAGS_VARIABLES}} -extldflags -static'

  MATRIX_GOOS: ['darwin', 'linux', 'windows']
  MATRIX_GOARCH: ['amd64', 'arm64']

tasks:
  default:
    silent: true
    deps:
    - mod
    - test
    - build

  clean:
    run: once
    cmds:
    - rm -f coverage.out
    - rm -f coverage.html
    - rm -fr bin
    - rm -fr dist

  mod:
    run: once
    sources:
    - '**/go.mod'
    - '**/go.sum'
    generates:
    - .task/.done_{{.TASK}}
    cmds:
    - go mod download
    - go mod tidy
    - go mod verify
    - cmd: touch .task/.done_{{.TASK}}
      silent: true

  test:
    run: once
    deps: [mod]
    sources:
    - '**/go.mod'
    - '**/go.sum'
    - '**/*.go'
    generates:
    - coverage.out
    - coverage.html
    cmds:
    - go test -race {{.BUILDFLAGS}} -cover -covermode atomic -coverprofile=coverage.out ./...
    - go tool cover -html=coverage.out -o coverage.html

  build:
    deps: [mod]
    sources:
    - '**/go.mod'
    - '**/go.sum'
    - '**/*.go'
    - exclude: '**/*_test.go'
    generates:
    - dist/{{.BINNAME}}
    vars:
      GOOS: '{{default OS .GOOS}}'
      GOARCH: '{{default ARCH .GOARCH}}'
      BINEXE: '{{if eq .GOOS "windows"}}.exe{{end}}'
      BINNAME: '{{base .ROOT_DIR}}_v{{.FULLVERSION}}_{{.GOOS}}_{{.GOARCH}}{{.BINEXE}}'
    env:
      CGO_ENABLED: 0
      GOOS: '{{.GOOS}}'
      GOARCH: '{{.GOARCH}}'
    cmds:
    - go build {{.BUILDFLAGS}} -o dist/{{.BINNAME}}

  build:sha256sum:
    dir: '{{.ROOT_DIR}}/dist'
    deps: [build]
    sources:
    - '{{.BINNAME}}'
    generates:
    - '{{.BINNAME}}.sha256sum'
    vars:
      GOOS: '{{default OS .GOOS}}'
      GOARCH: '{{default ARCH .GOARCH}}'
      BINEXE: '{{if eq .GOOS "windows"}}.exe{{end}}'
      BINNAME: '{{base .ROOT_DIR}}_v{{.FULLVERSION}}_{{.GOOS}}_{{.GOARCH}}{{.BINEXE}}'
    cmds:
    - sha256sum "{{.BINNAME}}" > "{{.BINNAME}}.sha256sum"

  build:sha256sum:verify:
    dir: '{{.ROOT_DIR}}/dist'
    deps: ['build:sha256sum']
    vars:
      GOOS: '{{default OS .GOOS}}'
      GOARCH: '{{default ARCH .GOARCH}}'
      BINEXE: '{{if eq .GOOS "windows"}}.exe{{end}}'
      BINNAME: '{{base .ROOT_DIR}}_v{{.FULLVERSION}}_{{.GOOS}}_{{.GOARCH}}{{.BINEXE}}'
    cmds:
    - sha256sum -c "{{.BINNAME}}.sha256sum"

  build:cosign:
    dir: '{{.ROOT_DIR}}/dist'
    deps: [build]
    sources:
    - '{{.BINNAME}}'
    generates:
    - '{{.BINNAME}}.cert'
    - '{{.BINNAME}}.sig'
    vars:
      GOOS: '{{default OS .GOOS}}'
      GOARCH: '{{default ARCH .GOARCH}}'
      BINEXE: '{{if eq .GOOS "windows"}}.exe{{end}}'
      BINNAME: '{{base .ROOT_DIR}}_v{{.FULLVERSION}}_{{.GOOS}}_{{.GOARCH}}{{.BINEXE}}'
    cmds:
    - >-
      cosign sign-blob {{.BINNAME}}
      -y
      --use-signing-config=false
      --new-bundle-format=false
      --output-certificate {{.BINNAME}}.cert
      --output-signature {{.BINNAME}}.sig

  build:release:
    run: once
    silent: true
    cmds:
    - for:
        matrix:
          GOOS:
            ref: .MATRIX_GOOS
          GOARCH:
            ref: .MATRIX_GOARCH
      vars:
        GOOS: '{{.ITEM.GOOS}}'
        GOARCH: '{{.ITEM.GOARCH}}'
      task: build

  build:matrix:
    run: once
    silent: true
    cmds:
    - >-
      jq -cMn
      --argjson goos '{{.MATRIX_GOOS | toJson}}'
      --argjson goarch '{{.MATRIX_GOARCH | toJson}}'
      '{include: [$goos[] as $os | $goarch[] | {goos: $os, goarch: .}]}'
