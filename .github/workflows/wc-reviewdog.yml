---
name: Reviewdog
on:
  workflow_call:
permissions: {}
concurrency:
  group: reviewdog-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  matrix:
    name: Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.matrix.outputs.result }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Setup aqua
      uses: aquaproj/aqua-installer@82d0e83878a8657c4a6f2ff1755d3bfbfc67f329 # v4.1.0
      with:
        aqua_version: v2.64.0
    - name: Generate Matrix
      id: matrix
      shell: bash
      run: echo "result=$(task reviewdog:matrix)" >> "$GITHUB_OUTPUT"
    - name: Check Matrix
      env:
        REVIEWDOG_MATRIX: ${{ steps.matrix.outputs.result }}
      run: |-
        echo "${REVIEWDOG_MATRIX}" | jq
  reviewdog:
    needs: matrix
    name: Reviewdog (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.targets) }}
    permissions:
      actions: read
      checks: write
      contents: read
      pull-requests: write
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Setup aqua
      uses: aquaproj/aqua-installer@82d0e83878a8657c4a6f2ff1755d3bfbfc67f329 # v4.1.0
      with:
        aqua_version: v2.64.0
    - name: Restore go mod cache
      if: contains(fromJson('["govet", "gosec", "golangci-lint"]'), matrix.name)
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: go-mod-${{ hashFiles('**/go.sum') }}
        restore-keys: |-
          go-mod-
        path: ~/go/pkg/mod/
    - name: Running reviewdog
      # The github-check reporter now and then gets a 404 when it updates the
      # check run it has just created ("failed to post result: PATCH
      # .../check-runs/<id>: 404 Not Found"), although the lint itself passed.
      # Only that failure is retried; lint findings and any other error fail
      # the job on the first attempt.
      run: |-
        log="${RUNNER_TEMP}/reviewdog.log"
        for attempt in 1 2 3; do
          if task "${REVIEWDOG_TARGET}" 2>&1 | tee "${log}"; then
            exit 0
          fi
          if ! grep -q 'reviewdog: failed to post result' "${log}"; then
            exit 1
          fi
          echo "::warning::reviewdog failed to post the result (attempt ${attempt}/3)"
          sleep $((attempt * 10))
        done
        exit 1
      env:
        REVIEWDOG_TARGET: ${{ matrix.target }}
        # A pull_request raised from a fork gets a read-only GITHUB_TOKEN
        # whatever this job's `permissions` asks for, so a review-posting
        # reporter answers 403. Falling back to `local` keeps the -fail-level
        # gate in the task, so findings still fail the job; only the inline
        # annotations are lost. pull_request_target keeps a write token even
        # from a fork, so it stays on the review reporter.
        REVIEWDOG_REPORTER: >-
          ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'local'
          || (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && 'github-pr-review'
          || github.event_name == 'push' && 'github-check'
          || 'local' }}
        REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Appended to the task's base REVIEWDOG_ARGS, which carry the
        # -fail-level/-filter-mode lint gate; these only add CI debug output.
        REVIEWDOG_ARGS: -log-level 'debug' -tee
